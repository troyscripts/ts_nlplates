<!doctype html>
<html lang="nl">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Kentekenbewijs</title><link rel="stylesheet" href="style.css"></head>
<body>
<main id="card" hidden aria-label="Kentekenbewijs">
  <header><div class="country">NL</div><div><small>NEDERLAND • VOERTUIGREGISTRATIE</small><h1>Kentekenbewijs</h1></div><button id="close" aria-label="Sluiten">×</button></header>
  <div class="body">
    <div class="plate"><span>NL</span><strong id="plate"></strong></div>
    <p class="caption">REGISTRATIEGEGEVENS</p>
    <dl>
      <div class="wide"><dt>Geregistreerde eigenaar</dt><dd id="owner"></dd></div>
      <div><dt>Merk</dt><dd id="brand"></dd></div><div><dt>Model</dt><dd id="model"></dd></div>
      <div><dt>Documentnummer</dt><dd id="number"></dd></div><div><dt>Datum van uitgifte</dt><dd id="date"></dd></div>
    </dl>
  </div>
  <footer><span>TROY SCRIPTS <b>•</b> ROLEPLAY DOCUMENT</span><span id="hint">ESC om te sluiten</span></footer>
</main>
<script src="app.js"></script>
</body></html>
